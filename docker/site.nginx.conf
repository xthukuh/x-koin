# The presentation site, served entirely behind the pass-wall.
#
# Every request except the four exemptions below runs an auth_request subrequest
# against the gate container, so no byte of index.html, of the JS bundle or of
# the docs corpus leaves this container without a valid signed cookie. A 401
# from the subrequest becomes a 302 to the password page carrying the path the
# visitor wanted.
#
# The gate is docker/gate, on the compose network as `gate:8081`. The name is
# resolved per request through Docker's embedded DNS rather than once at start,
# because a `docker compose up -d gate` after a password change gives the gate a
# new address and nginx would otherwise keep proxying to the dead one and answer
# 500 for the whole site. That is what the resolver line and the $gate variable
# in proxy_pass are for: a proxy_pass holding a variable is re-resolved.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;
  set $gate gate:8081;

  # Redirects go out as a path, not as a rebuilt absolute URL. nginx would
  # otherwise reconstruct the origin from $host and its own listen port, which
  # loses the :8090 of the local test and downgrades the VPS to http, because
  # TLS is terminated one hop earlier by Traefik.
  absolute_redirect off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

  # The wall. Declared at server level so a location added later is protected by
  # default and has to opt out on purpose, rather than the other way round.
  auth_request /auth;
  error_page 401 = @gate;

  location = /auth {
    internal;
    proxy_pass http://$gate/auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
  }

  # $request_uri is the raw target, query string included. It is handed over as
  # the whole of the `next` value rather than as one parameter among several, so
  # no escaping is needed here: the gate reads everything after `next=` and
  # validates it down to a same-origin absolute path.
  location @gate {
    auth_request off;
    return 302 /gate?next=$request_uri;
  }

  # The password page itself, and the logout link.
  location ^~ /gate {
    auth_request off;
    proxy_pass http://$gate;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Container healthcheck and uptime probes. Says nothing about the site.
  location = /healthz {
    auth_request off;
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Two files stay public so that a crawler that finds the hostname is told to
  # go away, and so that a browser tab has an icon on the password page.
  location = /robots.txt {
    auth_request off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    try_files $uri =404;
  }

  location = /favicon.svg {
    auth_request off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    try_files $uri =404;
  }

  # Vite writes content-hashed filenames into /assets, so they can be cached for
  # a year and never revalidated. They are still behind the wall: the cache is
  # the visitor's own browser, and the auth_request runs before the file is
  # read. An add_header in a location replaces the inherited set rather than
  # adding to it, so the server-level headers are repeated here.
  location /assets/ {
    add_header Cache-Control "private, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    try_files $uri =404;
  }

  # SPA fallback: a client-side route such as /docs/papers/foo or /shop is
  # served the application shell and resolved by React Router. $uri/ is
  # deliberately absent from try_files, because a request for /shop would
  # otherwise 301 to /shop/ on the strength of the public/shop directory.
  #
  # no-store rather than the old `expires -1`: a shared or borrowed laptop must
  # not keep the pages after the cookie is gone. `expires` would set its own
  # Cache-Control and collide with this one, so it is not used.
  location / {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    try_files $uri /index.html;
  }
}
