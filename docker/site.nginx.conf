server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Vite writes content-hashed filenames into /assets, so they can be cached for
  # a year and never revalidated. An add_header in a location replaces the
  # inherited set rather than adding to it, so the two headers above are
  # repeated here.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  # The legacy pages are rebuilt in place under the same names, so they must be
  # revalidated on every request. `expires` sets Cache-Control without
  # cancelling the inherited add_header directives.
  location /legacy/ {
    expires -1;
    try_files $uri =404;
  }

  # SPA fallback: a client-side route such as /docs/papers/foo or /shop is
  # served the application shell and resolved by React Router. $uri/ is
  # deliberately absent from try_files, because a request for /shop would
  # otherwise 301 to /shop/ on the strength of the public/shop directory.
  location / {
    expires -1;
    try_files $uri /index.html;
  }
}
