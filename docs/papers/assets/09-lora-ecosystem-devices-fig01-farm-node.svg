<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="IBM Plex Mono, Consolas, Menlo, monospace" font-size="13" fill="#14213d">
  <!-- xKoin LoRa ecosystem paper, Figure 1. Farm sensor node block diagram and its
       place on the free LAN plane. Schematic style. -->
  <defs>
    <marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b3d91"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b8741a"/>
    </marker>
  </defs>
  <style>
    .box { fill: #ffffff; stroke: #14213d; stroke-width: 2; }
    .acc { fill: #eef2fa; stroke: #0b3d91; stroke-width: 2; }
    .mon { fill: #fdf6ec; stroke: #b8741a; stroke-width: 2; }
    .seg { fill: #f7f9fd; stroke: #14213d; stroke-width: 1.5; stroke-dasharray: 8 5; }
    .flow { fill: none; stroke: #0b3d91; stroke-width: 2; marker-end: url(#ai); }
    .pwr { fill: none; stroke: #b8741a; stroke-width: 2.5; marker-end: url(#am); }
    .radio { fill: none; stroke: #0b3d91; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#ai); }
    .h { font-size: 14px; letter-spacing: 0.05em; fill: #14213d; }
    .s { font-size: 12px; fill: #3c4a67; }
  </style>

  <rect width="1200" height="800" fill="#ffffff"/>

  <text x="50" y="40" class="h">THE FARM NODE AND THE FREE LAN PLANE</text>

  <!-- sensors -->
  <rect x="50" y="100" width="220" height="90" class="box"/>
  <text x="64" y="126" class="h">SOIL MOISTURE v2.0</text>
  <text x="64" y="148" class="s">capacitive, analog out</text>
  <text x="64" y="168" class="s">0 to 3 V into ADC1_CH0</text>
  <text x="64" y="186" class="s">no exposed electrodes to corrode</text>

  <rect x="50" y="220" width="220" height="90" class="box"/>
  <text x="64" y="246" class="h">DHT22 or AHT20</text>
  <text x="64" y="268" class="s">air temperature and humidity</text>
  <text x="64" y="288" class="s">DHT22: one-wire on GPIO1</text>
  <text x="64" y="306" class="s">AHT20: I2C, the better part</text>

  <rect x="50" y="376" width="220" height="126" class="mon"/>
  <text x="64" y="402" class="h" fill="#b8741a">POWER</text>
  <text x="64" y="424" class="s">18650 + TP4056</text>
  <text x="64" y="444" class="s">6 V 2 W panel optional</text>
  <text x="64" y="464" class="s">HT7333 LDO, 4 uA quiescent,</text>
  <text x="64" y="484" class="s">straight into the 3V3 pin</text>

  <!-- the node -->
  <rect x="330" y="90" width="420" height="420" class="seg"/>
  <text x="346" y="118" class="h">FARM SENSOR NODE</text>
  <text x="346" y="138" class="s">ESP32-C3 SuperMini plus Ai-Thinker Ra-01SH, all pins proposed</text>

  <rect x="350" y="166" width="380" height="130" class="acc"/>
  <text x="364" y="192" class="h">ESP32-C3FH4</text>
  <text x="364" y="214" class="s">RISC-V, 4 MB flash, 22 by 18 mm</text>
  <text x="364" y="234" class="s">timer wake, deep sleep between reads</text>
  <text x="364" y="254" class="s">only GPIO0 to GPIO5 wake from deep sleep</text>
  <text x="364" y="274" class="s">Ed25519 identity, same Law 1 node id</text>

  <rect x="350" y="330" width="380" height="110" class="acc"/>
  <text x="364" y="356" class="h">Ra-01SH (SX1262)</text>
  <text x="364" y="378" class="s">803 to 930 MHz, +22 dBm, SPI, 3.3 V only</text>
  <text x="364" y="398" class="s">IPEX connector, pigtail to an SMA bulkhead</text>
  <text x="364" y="418" class="s">TX burst is the whole current budget</text>

  <path d="M 540 300 V 326" class="flow"/>
  <text x="352" y="470" class="s">One TELEMETRY frame per read: 8 byte src, a reading, a CRC. Nothing else.</text>
  <text x="352" y="492" class="s">No voucher, no receipt, no ticket, because no wide-area byte is spent.</text>

  <path d="M 274 145 H 344" class="flow"/>
  <path d="M 274 265 H 344" class="flow"/>
  <path d="M 274 400 Q 310 400 310 230 H 344" class="pwr"/>

  <!-- antenna and hop -->
  <path d="M 754 385 H 810" class="flow"/>
  <path d="M 810 385 v -70 m -14 14 l 14 -14 l 14 14" stroke="#14213d" stroke-width="2" fill="none"/>
  <text x="762" y="424" class="s">868 MHz</text>

  <path d="M 810 300 Q 880 220 950 200" class="radio"/>
  <text x="820" y="256" class="s">LoRa hop, free plane</text>

  <rect x="900" y="120" width="250" height="160" class="acc"/>
  <text x="914" y="146" class="h">xKoin-SATELLITE</text>
  <text x="914" y="168" class="s">or a Node directly</text>
  <text x="914" y="192" class="s">relays the TELEMETRY</text>
  <text x="914" y="212" class="s">frame onward and</text>
  <text x="914" y="232" class="s">charges nothing for it:</text>
  <text x="914" y="252" class="s">the frame never leaves</text>
  <text x="914" y="272" class="s">the mesh</text>

  <path d="M 1025 284 V 340" class="flow"/>

  <rect x="900" y="344" width="250" height="120" class="box"/>
  <text x="914" y="370" class="h">NODE DASHBOARD</text>
  <text x="914" y="392" class="s">soil moisture, temperature,</text>
  <text x="914" y="412" class="s">battery, RSSI per node</text>
  <text x="914" y="432" class="s">acceptance test D6:</text>
  <text x="914" y="452" class="s">zero XKN spent</text>

  <!-- interop strip -->
  <rect x="50" y="560" width="1100" height="190" class="box"/>
  <text x="66" y="586" class="h">WHAT THE MESHTASTIC HANDSET DOES AND DOES NOT PROVE</text>

  <rect x="66" y="604" width="520" height="128" class="acc"/>
  <text x="80" y="630" class="h">CLAIMED</text>
  <text x="80" y="652" class="s">A stock Meshtastic Heltec V3 and an xKoin device on the same</text>
  <text x="80" y="672" class="s">channel see each other at the discovery layer, because the BEACON</text>
  <text x="80" y="692" class="s">frame keeps Meshtastic framing compatibility. Spec section 2 says</text>
  <text x="80" y="712" class="s">this and says it for discovery only.</text>

  <rect x="614" y="604" width="520" height="128" class="mon"/>
  <text x="628" y="630" class="h" fill="#b8741a">NOT CLAIMED</text>
  <text x="628" y="652" class="s">No message interoperation, no routing between the two meshes, no</text>
  <text x="628" y="672" class="s">Meshtastic client talking to the xKoin payment plane, no xKoin</text>
  <text x="628" y="692" class="s">frame carried by a Meshtastic router. XKP frames 1 through 8 are</text>
  <text x="628" y="712" class="s">xKoin only and a Meshtastic node drops them.</text>
</svg>
