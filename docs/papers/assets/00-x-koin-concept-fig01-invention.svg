<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="IBM Plex Mono, Consolas, Menlo, monospace" font-size="13" fill="#14213d">
  <!-- xKoin concept paper, Figure 1. Schematic style: white ground, #14213d ink,
       #0b3d91 accent for frames, #b8741a for money. -->
  <defs>
    <marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b3d91"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b8741a"/>
    </marker>
  </defs>
  <style>
    .box { fill: #ffffff; stroke: #14213d; stroke-width: 2; }
    .acc { fill: #eef2fa; stroke: #0b3d91; stroke-width: 2; }
    .mon { fill: #fdf6ec; stroke: #b8741a; stroke-width: 2; }
    .flow { fill: none; stroke: #0b3d91; stroke-width: 2; marker-end: url(#ai); }
    .cash { fill: none; stroke: #b8741a; stroke-width: 2.5; marker-end: url(#am); }
    .h { font-size: 14px; letter-spacing: 0.05em; fill: #14213d; }
    .s { font-size: 12px; fill: #3c4a67; }
    .m { font-size: 11px; fill: #b8741a; }
  </style>

  <rect width="1200" height="800" fill="#ffffff"/>

  <!-- top row -->
  <rect x="50" y="60" width="330" height="66" class="box"/>
  <text x="64" y="86" class="h">INTERNET BACKHAUL</text>
  <text x="64" y="106" class="s">LTE, fibre or a phone hotspot</text>

  <rect x="440" y="60" width="330" height="66" class="acc"/>
  <text x="454" y="86" class="h">GATEWAY-API (cloud)</text>
  <text x="454" y="106" class="s">bridge, voucher issuer, relayer</text>

  <rect x="850" y="60" width="310" height="96" class="mon"/>
  <text x="864" y="86" class="h">BASE L2 SETTLEMENT</text>
  <text x="864" y="106" class="s">xKoinToken (XKN, 6 dp)</text>
  <text x="864" y="124" class="s">xKoinEscrow, xKoinTreasury</text>
  <text x="864" y="144" class="s">1 XKN = 1 KES by peg</text>

  <!-- key -->
  <rect x="50" y="160" width="200" height="72" class="box"/>
  <text x="60" y="180" class="h">KEY</text>
  <path d="M 60 198 H 92" stroke="#0b3d91" stroke-width="2" fill="none"/>
  <text x="98" y="202" class="s">frames, bytes</text>
  <path d="M 60 218 H 92" stroke="#b8741a" stroke-width="2.5" fill="none"/>
  <text x="98" y="222" class="s">money</text>

  <!-- node -->
  <rect x="280" y="250" width="340" height="120" class="acc"/>
  <text x="296" y="280" class="h">xKoin-NODE</text>
  <text x="296" y="302" class="s">backhaul in, Wi-Fi AP out</text>
  <text x="296" y="322" class="s">meters every WAN byte</text>
  <text x="296" y="342" class="s">verifies vouchers offline</text>
  <text x="296" y="360" class="s">keeps the latest receipt only</text>

  <!-- free lan note -->
  <rect x="632" y="262" width="178" height="110" class="mon"/>
  <text x="644" y="288" class="h" fill="#b8741a">FREE LAN PLANE</text>
  <text x="644" y="310" class="s">traffic that stays</text>
  <text x="644" y="328" class="s">inside this mesh</text>
  <text x="644" y="346" class="s">costs zero XKN</text>
  <text x="644" y="364" class="s">and needs no voucher</text>

  <!-- planes -->
  <rect x="50" y="410" width="370" height="76" class="acc"/>
  <text x="64" y="436" class="h">MAINS PLANE</text>
  <text x="64" y="456" class="s">HomePlug AV, ~10 Mbps model</text>
  <text x="64" y="474" class="s">KQ-130F, 128 B frames</text>

  <rect x="440" y="410" width="370" height="76" class="acc"/>
  <text x="454" y="436" class="h">RADIO PLANE</text>
  <text x="454" y="456" class="s">LoRa 868.1 MHz SF7</text>
  <text x="454" y="474" class="s">~5.4 kbps, 226 B frames</text>

  <!-- edge devices -->
  <rect x="50" y="560" width="370" height="96" class="box"/>
  <text x="64" y="588" class="h">xKoin-NODE-SATELLITE</text>
  <text x="64" y="610" class="s">wall socket, same mains segment</text>
  <text x="64" y="630" class="s">regenerates Wi-Fi, admits clients</text>
  <text x="64" y="648" class="s">carries class A and class B service</text>

  <rect x="440" y="560" width="370" height="96" class="box"/>
  <text x="454" y="588" class="h">xKoin-SATELLITE</text>
  <text x="454" y="610" class="s">solar, deep sleep, off grid</text>
  <text x="454" y="630" class="s">class C service over LoRa</text>
  <text x="454" y="648" class="s">relays to the nearest Node</text>

  <rect x="50" y="700" width="340" height="72" class="box"/>
  <text x="64" y="726" class="h">xKoin-CLIENT</text>
  <text x="64" y="746" class="s">phone on Wi-Fi, companion app</text>
  <text x="64" y="764" class="s">or the OTG dongle for LoRa</text>

  <rect x="420" y="700" width="350" height="72" class="box"/>
  <text x="434" y="726" class="h">LORA ECOSYSTEM DEVICES</text>
  <text x="434" y="746" class="s">farm sensor, tank level,</text>
  <text x="434" y="764" class="s">Meshtastic handset</text>

  <!-- money column -->
  <rect x="850" y="240" width="310" height="96" class="mon"/>
  <text x="864" y="266" class="h">SETTLEMENT SPLIT</text>
  <text x="864" y="288" class="s">95 percent to the operator</text>
  <text x="864" y="308" class="s">5 percent to the treasury</text>
  <text x="864" y="326" class="s">(fee capped at 10 percent)</text>

  <rect x="850" y="420" width="310" height="96" class="mon"/>
  <text x="864" y="446" class="h">CASH OUT</text>
  <text x="864" y="468" class="s">operator claims earnings</text>
  <text x="864" y="488" class="s">founder claims the fee</text>
  <text x="864" y="506" class="s">bridge burns what it pays</text>

  <rect x="850" y="600" width="310" height="96" class="mon"/>
  <text x="864" y="626" class="h">FIAT RAILS</text>
  <text x="864" y="648" class="s">M-Pesa (Daraja)</text>
  <text x="864" y="668" class="s">Equitel (Jenga)</text>
  <text x="864" y="686" class="s">KES in, KES out</text>

  <!-- flows -->
  <path d="M 215 126 V 145 H 340 V 250" class="flow"/>
  <path d="M 340 370 V 410" class="flow"/>
  <path d="M 560 370 V 410" class="flow"/>
  <path d="M 235 486 V 560" class="flow"/>
  <path d="M 625 486 V 560" class="flow"/>
  <path d="M 220 656 V 700" class="flow"/>
  <path d="M 595 656 V 700" class="flow"/>

  <!-- money -->
  <path d="M 220 772 V 790 H 1005 V 700" class="cash"/>
  <text x="440" y="785" class="m">KES top-up by STK push, and payouts back out</text>
  <path d="M 850 630 H 826 V 93 H 774" class="cash"/>
  <path d="M 700 60 V 40 H 1005 V 56" class="cash"/>
  <text x="712" y="32" class="m">bridgeMint: XKN to the user address, plus a signed voucher</text>
  <path d="M 560 250 V 190 H 640 V 130" class="cash"/>
  <text x="568" y="184" class="m">tickets (EIP-712)</text>
  <path d="M 1005 156 V 236" class="cash"/>
  <text x="1014" y="200" class="m">settleTicketBatch</text>
  <path d="M 1005 336 V 416" class="cash"/>
  <text x="1014" y="382" class="m">claim, earnings</text>
  <path d="M 1005 516 V 596" class="cash"/>
  <text x="1014" y="562" class="m">send to mobile</text>
</svg>
