<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="IBM Plex Mono, Consolas, Menlo, monospace" font-size="13" fill="#e9f0ff">
  <!--
    Farm sensor node wiring blueprint. Copied from _template-blueprint.svg: frame,
    grid, defs, style block and title block unchanged; drawing group and title
    block text replaced. Every pin on this drawing is PROPOSED.
  -->
  <defs>
    <pattern id="minor" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
    </pattern>
    <pattern id="major" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#minor)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffffff"/>
    </marker>
    <marker id="dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 5 L 10 5 M 5 0 L 5 10" stroke="#ffffff" stroke-width="1.5"/>
    </marker>
  </defs>
  <style>
    .line { fill: none; stroke: #ffffff; stroke-width: 1.5; }
    .thin { fill: none; stroke: #9fc0ff; stroke-width: 1; }
    .dash { fill: none; stroke: #9fc0ff; stroke-width: 1; stroke-dasharray: 6 4; }
    .warn { fill: none; stroke: #ffd166; stroke-width: 1.5; }
    .fillp { fill: #0b3d91; stroke: #ffffff; stroke-width: 1.5; }
    .label { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; }
    .small { font-size: 11px; fill: #c9d8ff; }
    .title { font-size: 22px; letter-spacing: 0.08em; text-transform: uppercase; }
    .lead { fill: none; stroke: #ffffff; stroke-width: 1; }
    .dimline { fill: none; stroke: #ffffff; stroke-width: 1; marker-start: url(#dim); marker-end: url(#dim); }
  </style>

  <rect width="1200" height="800" fill="#0b3d91"/>
  <rect width="1200" height="800" fill="url(#major)"/>
  <rect x="30" y="30" width="1140" height="740" class="line"/>

  <g id="drawing">
    <text x="60" y="70" class="title">Farm sensor node</text>
    <text x="60" y="92" class="label">Wiring blueprint, ESP32-C3 SuperMini and Ra-01SH. ALL PINS PROPOSED.</text>

    <!-- power column -->
    <polygon points="70,150 220,150 204,124 86,124" class="fillp"/>
    <text x="92" y="144" class="label">Panel 6 V 2 W</text>
    <rect x="70" y="190" width="180" height="76" class="fillp"/>
    <text x="82" y="214" class="label">TP4056 + prot</text>
    <text x="82" y="234" class="small">IN+ / IN- from panel</text>
    <text x="82" y="252" class="small">B+ / B- to the cell</text>
    <rect x="70" y="296" width="180" height="66" class="fillp"/>
    <text x="82" y="320" class="label">18650 cell</text>
    <text x="82" y="340" class="small">3.7 V, 3400 mAh</text>
    <rect x="70" y="392" width="180" height="76" class="fillp"/>
    <text x="82" y="416" class="label">HT7333 LDO</text>
    <text x="82" y="436" class="small">4 uA quiescent</text>
    <text x="82" y="454" class="small">OUT to the 3V3 PIN</text>
    <path d="M 160 154 V 186" class="line"/>
    <path d="M 160 270 V 292" class="line"/>
    <path d="M 160 366 V 388" class="line"/>
    <path d="M 254 430 H 340" class="line" marker-end="url(#arrow)"/>
    <text x="258" y="420" class="small">bypass the on-board LDO</text>

    <!-- board -->
    <rect x="340" y="150" width="300" height="440" rx="12" class="line"/>
    <text x="354" y="178" class="label">ESP32-C3 SuperMini</text>
    <text x="354" y="196" class="small">ESP32-C3FH4, 22 by 18 mm, castellated</text>
    <circle cx="358" cy="168" r="5" class="thin"/>
    <circle cx="622" cy="168" r="5" class="thin"/>
    <circle cx="358" cy="572" r="5" class="thin"/>
    <circle cx="622" cy="572" r="5" class="thin"/>

    <text x="356" y="230" class="label">Left pads</text>
    <text x="356" y="252" class="small">GPIO0  soil ADC1_CH0</text>
    <text x="356" y="272" class="small">GPIO1  DHT22 data</text>
    <text x="356" y="292" class="small">GPIO2  RESET (pull-up)</text>
    <text x="356" y="312" class="small">GPIO3  DIO1 IRQ, RTC wake</text>
    <text x="356" y="332" class="small">GPIO4  SCK</text>
    <text x="356" y="352" class="small">GPIO5  MISO</text>
    <text x="356" y="372" class="small">GPIO6  MOSI</text>
    <text x="356" y="392" class="small">GPIO7  NSS</text>
    <text x="356" y="412" class="small">GPIO10 BUSY</text>
    <text x="356" y="444" class="label">Left alone</text>
    <text x="356" y="466" class="small">GPIO8  on-board LED</text>
    <text x="356" y="486" class="small">GPIO9  BOOT button</text>
    <text x="356" y="506" class="small">GPIO20 / 21 UART0 console</text>
    <text x="356" y="538" class="label">3V3 pin</text>
    <text x="356" y="558" class="small">fed from HT7333, 100 uF bulk</text>

    <!-- radio -->
    <rect x="720" y="200" width="230" height="230" class="fillp"/>
    <text x="732" y="226" class="label">Ra-01SH (SX1262)</text>
    <text x="732" y="250" class="small">SCK   from GPIO4</text>
    <text x="732" y="270" class="small">MISO  to   GPIO5</text>
    <text x="732" y="290" class="small">MOSI  from GPIO6</text>
    <text x="732" y="310" class="small">NSS   from GPIO7</text>
    <text x="732" y="330" class="small">NRESET from GPIO2</text>
    <text x="732" y="350" class="small">BUSY  to   GPIO10</text>
    <text x="732" y="370" class="small">DIO1  to   GPIO3</text>
    <text x="732" y="392" class="small">VCC 3.3 V only, GND common</text>
    <text x="732" y="412" class="small">IPEX u.FL connector</text>

    <path d="M 644 320 H 716" class="line" marker-end="url(#arrow)"/>
    <text x="646" y="310" class="small">SPI + 2 control lines</text>

    <!-- antenna -->
    <path d="M 954 300 H 1020" class="line" marker-end="url(#arrow)"/>
    <text x="958" y="290" class="small">IPEX to SMA pigtail</text>
    <path d="M 1020 300 v -80 m -14 14 l 14 -14 l 14 14" class="line"/>
    <text x="1000" y="336" class="label">Antenna</text>
    <text x="1000" y="354" class="small">868 MHz whip</text>

    <!-- sensors -->
    <rect x="720" y="470" width="230" height="76" class="fillp"/>
    <text x="732" y="494" class="label">Soil moisture v2.0</text>
    <text x="732" y="514" class="small">AOUT to GPIO0, VCC 3.3 V</text>
    <text x="732" y="532" class="small">series 10k, 100 nF to GND</text>
    <rect x="990" y="470" width="160" height="76" class="fillp"/>
    <text x="1002" y="494" class="label">DHT22</text>
    <text x="1002" y="514" class="small">DATA to GPIO1</text>
    <text x="1002" y="532" class="small">10k pull-up to 3V3</text>
    <path d="M 644 500 H 716" class="line" marker-end="url(#arrow)"/>
    <path d="M 954 508 H 986" class="line"/>

    <!-- dimension -->
    <path d="M 340 612 H 640" class="dimline"/>
    <text x="490" y="634" text-anchor="middle" class="small">22.00 mm by 18.00 mm board</text>

    <!-- callouts and warnings -->
    <path d="M 640 292 L 690 160 H 760" class="lead"/>
    <circle cx="640" cy="292" r="3" fill="#ffffff"/>
    <text x="766" y="164" class="small">GPIO2 is a strapping pin: it must read HIGH at boot.</text>
    <text x="766" y="182" class="small">The SX1262 reset line idles high and the 10k pull-up guarantees it.</text>

    <path d="M 60 660 h 60 v 20" class="warn"/>
    <text x="60" y="702" class="small" fill="#ffd166">Ra-01SH is 3.3 V only. A 5 V rail on VCC destroys it, and there is no level shifter anywhere on this drawing.</text>
    <text x="60" y="722" class="small">Deep-sleep wake on the C3 is limited to GPIO0 through GPIO5, which is why DIO1 sits on GPIO3 and BUSY, which never wakes anything, sits on GPIO10.</text>
    <text x="60" y="742" class="small">No mains anywhere. This node is battery and solar only.</text>
  </g>

  <g id="titleblock" transform="translate(780 640)">
    <rect width="390" height="130" class="line" fill="#0b3d91"/>
    <path d="M 0 26 H 390 M 0 52 H 390 M 0 78 H 390 M 0 104 H 390 M 110 0 V 130" class="thin"/>
    <text x="10" y="18" class="label">Project</text><text x="120" y="18" class="small">xKoin proof of concept</text>
    <text x="10" y="44" class="label">Drawing</text><text x="120" y="44" class="small">XK-FARM-WIRING</text>
    <text x="10" y="70" class="label">Date</text><text x="120" y="70" class="small">2026-09-13</text>
    <text x="10" y="96" class="label">Units</text><text x="120" y="96" class="small">millimetres, not to scale</text>
    <text x="10" y="122" class="label">Rev</text><text x="120" y="122" class="small">A, all pins proposed</text>
  </g>
</svg>
