<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <rect x="0" y="0" width="1200" height="800" fill="#ffffff"/>

  <text x="30" y="42" font-family="monospace" font-size="22" fill="#14213d">XKP phases P0 to P4: one session from beacon to settlement</text>

  <!-- lifeline heads -->
  <rect x="180" y="66" width="160" height="40" fill="#ffffff" stroke="#14213d" stroke-width="2"/>
  <text x="260" y="92" font-family="monospace" font-size="14" fill="#14213d" text-anchor="middle">client</text>
  <rect x="450" y="66" width="160" height="40" fill="#ffffff" stroke="#14213d" stroke-width="2"/>
  <text x="530" y="92" font-family="monospace" font-size="14" fill="#14213d" text-anchor="middle">node</text>
  <rect x="720" y="66" width="160" height="40" fill="#ffffff" stroke="#14213d" stroke-width="2"/>
  <text x="800" y="92" font-family="monospace" font-size="14" fill="#14213d" text-anchor="middle">gateway-api</text>
  <rect x="990" y="66" width="160" height="40" fill="#ffffff" stroke="#14213d" stroke-width="2"/>
  <text x="1070" y="92" font-family="monospace" font-size="14" fill="#14213d" text-anchor="middle">chain (Base)</text>

  <!-- lifelines -->
  <line x1="260" y1="106" x2="260" y2="760" stroke="#14213d" stroke-width="1" stroke-dasharray="6 6"/>
  <line x1="530" y1="106" x2="530" y2="760" stroke="#14213d" stroke-width="1" stroke-dasharray="6 6"/>
  <line x1="800" y1="106" x2="800" y2="760" stroke="#14213d" stroke-width="1" stroke-dasharray="6 6"/>
  <line x1="1070" y1="106" x2="1070" y2="760" stroke="#14213d" stroke-width="1" stroke-dasharray="6 6"/>

  <!-- phase bands -->
  <text x="20" y="148" font-family="monospace" font-size="14" fill="#0b3d91">P0 DISCOVERY</text>
  <line x1="20" y1="160" x2="1160" y2="160" stroke="#0b3d91" stroke-width="1"/>
  <text x="20" y="196" font-family="monospace" font-size="14" fill="#0b3d91">P1 ADMISSION</text>
  <line x1="20" y1="300" x2="1160" y2="300" stroke="#0b3d91" stroke-width="1"/>
  <text x="20" y="336" font-family="monospace" font-size="14" fill="#0b3d91">P2 TRANSFER</text>
  <line x1="20" y1="440" x2="1160" y2="440" stroke="#0b3d91" stroke-width="1"/>
  <text x="20" y="476" font-family="monospace" font-size="14" fill="#0b3d91">P3 PROOF</text>
  <line x1="20" y1="580" x2="1160" y2="580" stroke="#0b3d91" stroke-width="1"/>
  <text x="20" y="616" font-family="monospace" font-size="14" fill="#0b3d91">P4 SETTLEMENT</text>

  <!-- P0 beacon -->
  <line x1="530" y1="140" x2="266" y2="140" stroke="#14213d" stroke-width="2"/>
  <polygon points="260,140 272,134 272,146" fill="#14213d"/>
  <text x="395" y="132" font-family="monospace" font-size="13" fill="#14213d" text-anchor="middle">BEACON (LoRa + PLC)</text>

  <!-- P1 join req -->
  <line x1="260" y1="200" x2="524" y2="200" stroke="#14213d" stroke-width="2"/>
  <polygon points="530,200 518,194 518,206" fill="#14213d"/>
  <text x="395" y="192" font-family="monospace" font-size="13" fill="#14213d" text-anchor="middle">JOIN_REQ + voucher</text>

  <rect x="540" y="212" width="230" height="44" fill="#ffffff" stroke="#0b3d91" stroke-width="2"/>
  <text x="655" y="230" font-family="monospace" font-size="12" fill="#0b3d91" text-anchor="middle">verify Ed25519 offline</text>
  <text x="655" y="248" font-family="monospace" font-size="12" fill="#0b3d91" text-anchor="middle">target under 4.5 ms</text>

  <line x1="530" y1="278" x2="266" y2="278" stroke="#14213d" stroke-width="2"/>
  <polygon points="260,278 272,272 272,284" fill="#14213d"/>
  <text x="395" y="270" font-family="monospace" font-size="13" fill="#14213d" text-anchor="middle">JOIN_ACK + session nonce</text>

  <!-- P2 data -->
  <line x1="260" y1="340" x2="524" y2="340" stroke="#14213d" stroke-width="2"/>
  <polygon points="530,340 518,334 518,346" fill="#14213d"/>
  <text x="395" y="332" font-family="monospace" font-size="13" fill="#14213d" text-anchor="middle">DATA (best live medium)</text>

  <line x1="530" y1="372" x2="266" y2="372" stroke="#14213d" stroke-width="2"/>
  <polygon points="260,372 272,366 272,378" fill="#14213d"/>
  <text x="395" y="364" font-family="monospace" font-size="13" fill="#14213d" text-anchor="middle">DATA_ACK (window 16)</text>

  <line x1="530" y1="406" x2="794" y2="406" stroke="#14213d" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="800,406 788,400 788,412" fill="#14213d"/>
  <text x="665" y="398" font-family="monospace" font-size="13" fill="#14213d" text-anchor="middle">read deposits[client]</text>
  <line x1="800" y1="428" x2="1064" y2="428" stroke="#14213d" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="1070,428 1058,422 1058,434" fill="#14213d"/>
  <text x="935" y="420" font-family="monospace" font-size="13" fill="#14213d" text-anchor="middle">escrow view call</text>

  <!-- P3 receipts -->
  <line x1="260" y1="480" x2="524" y2="480" stroke="#14213d" stroke-width="2"/>
  <polygon points="530,480 518,474 518,486" fill="#14213d"/>
  <text x="395" y="472" font-family="monospace" font-size="13" fill="#14213d" text-anchor="middle">RECEIPT 108 B, every interval</text>

  <line x1="530" y1="512" x2="266" y2="512" stroke="#14213d" stroke-width="2"/>
  <polygon points="260,512 272,506 272,518" fill="#14213d"/>
  <text x="395" y="504" font-family="monospace" font-size="13" fill="#14213d" text-anchor="middle">RECEIPT_ACK</text>

  <rect x="540" y="524" width="250" height="44" fill="#ffffff" stroke="#0b3d91" stroke-width="2"/>
  <text x="665" y="542" font-family="monospace" font-size="12" fill="#0b3d91" text-anchor="middle">keep latest receipt only</text>
  <text x="665" y="560" font-family="monospace" font-size="12" fill="#0b3d91" text-anchor="middle">unproven credit capped 2x</text>

  <!-- P4 settlement -->
  <line x1="260" y1="620" x2="524" y2="620" stroke="#b8741a" stroke-width="2"/>
  <polygon points="530,620 518,614 518,626" fill="#b8741a"/>
  <text x="395" y="612" font-family="monospace" font-size="13" fill="#b8741a" text-anchor="middle">EIP-712 Ticket signature</text>

  <line x1="530" y1="656" x2="794" y2="656" stroke="#b8741a" stroke-width="2"/>
  <polygon points="800,656 788,650 788,662" fill="#b8741a"/>
  <text x="665" y="648" font-family="monospace" font-size="13" fill="#b8741a" text-anchor="middle">ticket to /settlement/relay</text>

  <line x1="800" y1="692" x2="1064" y2="692" stroke="#b8741a" stroke-width="2"/>
  <polygon points="1070,692 1058,686 1058,698" fill="#b8741a"/>
  <text x="935" y="684" font-family="monospace" font-size="13" fill="#b8741a" text-anchor="middle">settleTicketBatch</text>

  <line x1="1070" y1="726" x2="806" y2="726" stroke="#b8741a" stroke-width="2"/>
  <polygon points="800,726 812,720 812,732" fill="#b8741a"/>
  <text x="935" y="718" font-family="monospace" font-size="13" fill="#b8741a" text-anchor="middle">BatchSettled: 95 / 5 split</text>

  <text x="30" y="768" font-family="monospace" font-size="12" fill="#0b3d91">solid dark: mesh frames    dashed: backhaul reads    accent: value movement</text>
</svg>
