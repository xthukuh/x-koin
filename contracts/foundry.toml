[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 2000
evm_version = "cancun"
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]
# Deploy.s.sol writes deployments/<chainId>.json; nothing else may touch disk.
fs_permissions = [{ access = "read-write", path = "./deployments" }]

# Cloud sandbox only: binaries.soliditylang.org is unreachable there, so a
# pre-fetched native solc is pinned. Local machines use the default profile
# and let Foundry fetch 0.8.26 itself. Run with FOUNDRY_PROFILE=sandbox to
# reproduce the cloud environment.
[profile.sandbox]
solc = "/usr/local/bin/solc"

[profile.default.fmt]
line_length = 100

[rpc_endpoints]
base_sepolia = "https://sepolia.base.org"
base = "https://mainnet.base.org"
